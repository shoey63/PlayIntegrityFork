name: Android CI
run-name: "CI #${{ github.run_number }} (${{ github.ref_name }})${{ inputs.note && format(' - {0}', inputs.note) || '' }}"

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Optional run label'
        required: false
        default: ''

jobs:
  build:

    runs-on: xcode-27

    steps:
    - name: Check out
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: 21

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew --warning-mode all assembleRelease

    - name: Label CI version when not a final release code
      run: |
        VERCODE=$(perl -n -e "print \$1 if /^versionCode=(.*)/" module/module.prop)
        if [ "$(echo $VERCODE | grep -o '.$')" -eq 1 ]; then
          perl -pi -e "s/^version=(.*)/version=\$1($VERCODE)-CI #${{ github.run_number }}/" module/module.prop
        fi

    - name: Set artifact name from latest commit
      run: |
        SHA=$(git rev-parse --short HEAD)
        MSG=$(git log -1 --pretty=%s | tr -cs 'A-Za-z0-9._-' '-' | cut -c1-50 | sed 's/^-//;s/-$//')
        echo "ARTIFACT_NAME=PlayIntegrityFork-CI_#${{ github.run_number }}-${SHA}${MSG:+-$MSG}" >> "$GITHUB_ENV"

    - name: Upload CI module zip as artifact zip
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: 'module/*'
        compression-level: 9
